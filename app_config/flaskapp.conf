<VirtualHost *:80>

    ServerName 192.168.1.93

    WSGIDaemonProcess flaskapp \
        python-home=/var/www/flaskapp/venv \
        python-path=/var/www/flaskapp

    WSGIProcessGroup flaskapp

    WSGIScriptAlias /papi /var/www/flaskapp/flaskapp.wsgi

    <Directory /var/www/flaskapp>
        Require all granted
    </Directory>


    Alias /papi/static /var/www/flaskapp/static

    <Directory /var/www/flaskapp/static>
        Require all granted
    </Directory>


    Alias /papi/originImg /var/www/flaskapp/originImg

    <Directory /var/www/flaskapp/originImg>
        Options FollowSymLinks
        Require all granted
    </Directory>


    Alias /papi/smallImg /var/www/flaskapp/smallImg

    <Directory /var/www/flaskapp/smallImg>
        Options FollowSymLinks
        Require all granted
    </Directory>


    Alias /papi/abooks /var/www/flaskapp/abooks

    <Directory /var/www/flaskapp/abooks>
        Options FollowSymLinks
        Require all granted
    </Directory>

</VirtualHost>
